<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Laporan Generator UBSI | Engine OpenXML (.docx), Typst &amp; Jurnal SINTA 1-6</title>
    <meta
      name="description"
      content="Paket AI Agent Skill dan Scaffolder berbasis Python OpenXML (.docx) serta Typst (.pdf) untuk Laporan/Proposal PKL UBSI, Skripsi TI, Audit TI COBIT 2019, dan Jurnal Ilmiah SINTA 1-6."
    />
    <link rel="icon" type="image/png" href="./diagrams/logo-ubsi.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ubsi-theme");
          var scheme = saved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-scheme", scheme);
        } catch (e) {
          document.documentElement.setAttribute("data-scheme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
